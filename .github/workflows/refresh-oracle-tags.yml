name: Refresh Scryfall oracle tags

# Rebuilds data/oracle-tags.json.gz by walking every ORACLE_CARD_TAG via
# tagger.scryfall.com's GraphQL endpoint. The full fetch is slow (~60-100
# min) because the endpoint rate-limits aggressively; the script handles
# 429s with exponential backoff and checkpoints progress so a stalled run
# can resume.
#
# Scheduled to run on the 2nd of every month so it doesn't collide with
# the oracle-bulk refresh (which runs on the 1st).

on:
  schedule:
    - cron: "0 9 2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-oracle-tags
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore progress checkpoint from prior runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Look for the most recent successful upload of oracle-tags-progress
          # from any prior workflow run.
          latest=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name=="oracle-tags-progress" and .expired==false)] | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -n "$latest" ]; then
            echo "Found prior progress artifact $latest, downloading..."
            mkdir -p data
            gh api "repos/${{ github.repository }}/actions/artifacts/$latest/zip" > /tmp/progress.zip
            unzip -o /tmp/progress.zip -d data/ || true
            ls -la data/_oracle-tags-progress.json || echo "no progress file in artifact"
          else
            echo "No prior progress artifact found, starting fresh."
          fi

      - name: Run refresh script
        run: |
          if [ -f data/_oracle-tags-progress.json ]; then
            echo "Resuming from checkpoint..."
            python scripts/refresh_oracle_tags.py --resume
          else
            python scripts/refresh_oracle_tags.py
          fi

      - name: Upload progress checkpoint (always, for resume)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-tags-progress
          path: data/_oracle-tags-progress.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # _oracle-tags-progress.json is a transient checkpoint and should not be
          # committed. The refresh script removes it on success but guard anyway.
          rm -f data/_oracle-tags-progress.json
          if [ -z "$(git status --porcelain data/oracle-tags.json.gz data/oracle-tags-meta.json)" ]; then
            echo "No changes — oracle-tag index already up to date."
            exit 0
          fi
          fetched_at=$(python -c "import json; print(json.load(open('data/oracle-tags-meta.json'))['fetched_at'])")
          git add data/oracle-tags.json.gz data/oracle-tags-meta.json
          git commit -m "chore(data): refresh oracle-tag index (fetched_at=${fetched_at})"
          git push
