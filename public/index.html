<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mtg-oracle — purchase / deck matcher</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<main>
  <header>
    <h1>mtg-oracle</h1>
    <p class="tag">Match a purchase list against your Moxfield or Archidekt decks. Commander-legal filtering, fuzzy matching, prerequisite-aware scoring.</p>
  </header>

  <form id="f">
    <div class="row">
      <label>
        <span>Username</span>
        <input id="user" type="text" placeholder="e.g. waedi" autocomplete="off" />
      </label>
      <label>
        <span>Deck source</span>
        <select id="source">
          <option value="moxfield">Moxfield</option>
          <option value="archidekt">Archidekt</option>
          <option value="both">Both</option>
        </select>
      </label>
      <label id="archidekt-user-label" style="display:none">
        <span>Archidekt username <em>(if different)</em></span>
        <input id="archidekt_user" type="text" placeholder="e.g. Wildcard" autocomplete="off" />
      </label>
      <label>
        <span>Scoring mode</span>
        <select id="scoring">
          <option value="hybrid">hybrid (keyword + tfidf)</option>
          <option value="tfidf">tfidf</option>
          <option value="keyword">keyword</option>
        </select>
      </label>
      <label>
        <span>Replacement mode</span>
        <select id="replacement_mode">
          <option value="auto">auto (theme-aware)</option>
          <option value="reinforce">reinforce theme</option>
          <option value="redundant">reduce redundancy</option>
        </select>
      </label>
    </div>

    <label>
      <span>Deck filter <em>(optional, comma-separated substrings)</em></span>
      <input id="decks" type="text" placeholder="paper, counterint++" autocomplete="off" />
    </label>

    <label>
      <span>Extra decks <em>(optional — paste Moxfield/Archidekt URLs or IDs, one per line or space-separated)</em></span>
      <textarea id="extra_decks" rows="3" placeholder="https://moxfield.com/decks/NNcqOt7UlUWCeo6F0FidlQ&#10;https://archidekt.com/decks/12345678" autocomplete="off"></textarea>
      <small class="hint">Use this if a public deck is missing from your username search (Moxfield's search index can lag behind for new/recently-updated decks). You can also use this without a username to score a single deck directly.</small>
    </label>

    <label>
      <span>Paste your card list <em>(one per line, optional "2x" prefix)</em></span>
      <textarea id="paste" rows="14" placeholder="1x Sram, Senior Edificer&#10;1x Hellkite Charger&#10;Reverberate&#10;..." required></textarea>
    </label>

    <div class="actions">
      <button type="submit" id="go">Match</button>
      <span id="status"></span>
    </div>
  </form>

  <section id="result" hidden>
    <div class="meta" id="meta"></div>
    <article id="report"></article>
  </section>
</main>

<script src="/marked.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
